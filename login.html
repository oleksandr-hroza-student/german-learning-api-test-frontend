<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Log In</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <h2>Log In</h2>

    <form>

        <label>Email</label>

        <input
                type="email"
                id="email"
                placeholder="Email"
                required
        >

        <label>Password</label>

        <input
                type="password"
                id="password"
                placeholder="Password"
                required
        >

        <button id="loginButton">

            Log In

        </button>

    </form>

    <p style="margin-top:20px;">

        Don't have an account?

        <a href="signup.html">

            Sign Up

        </a>

    </p>

</div>

<script type="module" src="js/login.js"></script>


</body>

</html>
