<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Sign Up</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    <form>

        <label>Email</label>

        <input
                type="email"
                id="email"
                required
        >

        <label>Password</label>

        <input
                type="password"
                id="password"
                required
        >

        <label>Confirm Password</label>

        <input
                type="password"
                id="confirmPassword"
                required
        >

        <button id="signUpButton">

            Create Account

        </button>

    </form>

    <p style="margin-top:20px;">

        Already have an account?

        <a href="login.html">

            Log In

        </a>

    </p>

</div>

<script type="module" src="js/signup.js"></script>

</body>

</html>
